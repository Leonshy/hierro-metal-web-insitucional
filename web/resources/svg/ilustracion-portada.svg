<svg role="img" aria-label="Secciones de acero: perfiles IPN y UPN, ángulo, caño redondo, tubos cuadrado y rectangular, y varillas de construcción" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  
